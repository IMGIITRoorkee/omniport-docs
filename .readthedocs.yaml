version: 2

# 3.11 is the ceiling: sphinx-autobuild pulls in pathtools, which imports the
# imp module that 3.12 removed. Sphinx itself installs well past 3.11.
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: requirements.txt
